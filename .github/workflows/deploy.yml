name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/unified.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # No trackers here: they are read at runtime from ATRIUM_TRACKERS
          # (see docs/telemetry.md), so this public image reports nowhere
          # unless an operator configures it.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_URL }}
            NEXT_PUBLIC_BILLING_ENABLED=true
            NEXT_PUBLIC_STRIPE_MODE=${{ vars.STRIPE_MODE || 'test' }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENABLED=${{ vars.NEXT_PUBLIC_SENTRY_ENABLED || 'false' }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            vibralabs/atrium:${{ github.sha }}
            vibralabs/atrium:latest
          no-cache: true

      # The description drifted for eight months because this was only ever run
      # by hand. The image and its Docker Hub page now ship together.
      #
      # Non-fatal on purpose: the image is the deliverable and it has already
      # been pushed by the time this runs. A Docker Hub outage, a rate limit or
      # a token that may push images but not edit repository metadata would
      # otherwise mark a good release as a failed deploy, and the run list would
      # stop distinguishing "the image did not publish" from "the marketing copy
      # did not sync". Check the step, not the run, to see whether it synced.
      - name: Sync Docker Hub description
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: ./scripts/update-dockerhub-readme.sh
