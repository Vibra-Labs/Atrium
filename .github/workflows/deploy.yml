name: Deploy

# Push-button production deploy: on merge to main, SSH to the Hetzner box and run
# the on-box deploy script (git pull -> docker build -> compose up -> health check
# -> auto-rollback on failure). The box builds pexlo-portal:latest locally from
# source; nothing is pulled from a registry.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH (base64 key + pinned host key)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.HETZNER_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # Sanity-check the key parses before we try to use it
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null && echo "SSH key OK"

      - name: Deploy on Hetzner (build-on-box + health-gated rollback)
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
              'bash /opt/pexlo-portal/deploy.sh'
