name: Deploy

# Push-button production deploy: on merge to main, SSH to the Hetzner box and run
# the on-box deploy script (git pull -> docker build -> compose up -> health check
# -> auto-rollback on failure). Replaces the old orphaned Docker Hub push workflow
# and the manual SSH deploy. The box builds pexlo-portal:latest locally from source;
# nothing is pulled from a registry.

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual "Run workflow" from the Actions tab

concurrency:
  group: production-deploy
  cancel-in-progress: false   # never interrupt an in-flight deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH (pinned host key)
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.HETZNER_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on Hetzner (build-on-box + health-gated rollback)
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
              'bash /opt/pexlo-portal/deploy.sh'
